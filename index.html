<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NICE ONE — Portal Pengadaan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .kotak { text-align: center; padding: 2rem; }
    .logo { font-size: 28px; font-weight: 600; color: #1C5518; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #6b7280; margin-bottom: 28px; }
    .putar {
      width: 26px; height: 26px; border: 3px solid #e5e7eb; border-top-color: #1C5518;
      border-radius: 50%; animation: putar 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes putar { to { transform: rotate(360deg); } }
    .status { font-size: 13px; color: #9ca3af; }
    .manual { font-size: 13px; color: #9ca3af; margin-top: 24px; }
    .manual a { color: #1C5518; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="kotak">
    <div class="logo">nice</div>
    <div class="sub">Portal Pengadaan &amp; Gudang</div>
    <div class="putar"></div>
    <p class="status">Mengarahkan ke portal&hellip;</p>
    <p class="manual">
      Tidak berpindah otomatis?
      <a id="tautan" href="#">Klik di sini</a>
    </p>
    <noscript><p class="manual">Aktifkan JavaScript di browser untuk membuka portal.</p></noscript>
  </div>

  <script>
    // ============================================================
    // CUKUP GANTI SATU BARIS INI.
    // Isi dengan alamat /exec dari Deploy -> Kelola deployment -> aplikasi Portal.
    // Contoh bentuk: https://script.google.com/macros/s/AKfycb.....panjang...../exec
    // ============================================================
    const ALAMAT = 'https://script.google.com/macros/s/AKfycbynjoHC-iQyxHgQa0XRTWoY3VnTnDaijwCDgfH8iQ-dCqRws-B6_BXAz3PdywlV0DLM/exec';

    // K-081 — REDIRECT, bukan iframe (Safari iPhone memblokir sesi login di dalam iframe).
    // window.location.replace (bukan .href) supaya tombol Back tidak nyangkut balik ke sini.
    if (/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(ALAMAT)) {
      document.getElementById('tautan').href = ALAMAT;
      window.location.replace(ALAMAT);
    } else {
      document.querySelector('.status').textContent = 'Alamat portal belum diisi di file index.html.';
      document.querySelector('.putar').style.display = 'none';
    }
  </script>
</body>
</html>
